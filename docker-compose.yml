services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: vialidad-backend
    restart: unless-stopped
    ports:
      - "${PORT_BACKEND:-8005}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - REFRESH_SECRET_KEY=${REFRESH_SECRET_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - VALIDATOR_URL=${VALIDATOR_URL}
      - ENVIRONMENT=production
      - PORT=8000
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - MAX_LOGIN_ATTEMPTS=${MAX_LOGIN_ATTEMPTS:-5}
      - LOCKOUT_DURATION_MINUTES=${LOCKOUT_DURATION_MINUTES:-5}
    volumes:
      # Montar Chromium del host (Rocky Linux / EPEL) para generación de PDFs
      - /usr/bin/chromium-browser:/usr/bin/chromium-browser:ro
      - /usr/lib64/chromium-browser:/usr/lib64/chromium-browser:ro
    networks:
      - vialidad-net

  frontend-admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        - VITE_API_URL=${VITE_API_URL_ADMIN}
    container_name: vialidad-admin
    restart: unless-stopped
    ports:
      - "${PORT_FRONTEND_ADMIN:-8085}:80"
    networks:
      - vialidad-net

  frontend-public:
    build:
      context: ./frontend-public
      dockerfile: Dockerfile
      network: host
      args:
        - VITE_API_URL=${VITE_API_URL_PUBLIC}
    container_name: vialidad-verificador
    restart: unless-stopped
    ports:
      - "${PORT_FRONTEND_PUBLIC:-8086}:80"
    networks:
      - vialidad-net

networks:
  vialidad-net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"
