# ==========================================
# CONFIGURACIÓN PARA EL VALIDADOR CUIDADANO (PÚBLICO)
# ==========================================
server {
    listen 80;
    # Cambia por tu dominio o subdominio público
    server_name verificador.sansalvador.gob.sv;

    # Redirigir todo el tráfico HTTP a HTTPS (Opcional, si tienes SSL)
    # return 301 https://$host$request_uri;

    access_log /var/log/nginx/vialidad_public_access.log;
    error_log /var/log/nginx/vialidad_public_error.log;

    location / {
        # Puerto donde corre el contenedor frontend-public (PORT_FRONTEND_PUBLIC)
        proxy_pass http://127.0.0.1:8086;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==========================================
# CONFIGURACIÓN PARA EL PANEL DE ADMINISTRACIÓN (ADMIN)
# ==========================================
server {
    listen 80;
    # Cambia por tu dominio o subdominio administrativo interno
    server_name adminvialidad.sansalvador.gob.sv;

    access_log /var/log/nginx/vialidad_admin_access.log;
    error_log /var/log/nginx/vialidad_admin_error.log;

    location / {
        # Puerto donde corre el contenedor frontend-admin (PORT_FRONTEND_ADMIN)
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
